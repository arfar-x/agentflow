# Endpoint group ("EndpointProviderConfiguration" in the Dify Plugin SDK).
# Deliberately no `settings` here -- the one thing this plugin's Endpoints
# need (the encryption/signing root secret) is generated and stored by the
# plugin itself (utils/secret_store.py), never entered by an admin, so
# there's nothing for a Studio "create Endpoint" form to ask for. Studio
# still asks the admin for a `name` when creating an instance (a param on
# the create-endpoint API call itself, not part of this file).
settings: []
endpoints:
  - endpoints/credentials_get.yaml
  - endpoints/credentials_post.yaml
