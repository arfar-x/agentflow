identity:
  name: "get_credentials_link"
  author: "agentflow"
  label:
    en_US: "Get My Credentials Link"
    zh_Hans: "Get My Credentials Link"
    pt_BR: "Get My Credentials Link"
    ja_JP: "Get My Credentials Link"
description:
  human:
    en_US: >-
      Generates a one-time, personal link for entering your own Jira or
      Confluence credentials. Open the link in your own browser -- your
      password is never sent through this chat or seen by the AI, only
      the link itself is.
    zh_Hans: >-
      Generates a one-time, personal link for entering your own Jira or
      Confluence credentials.
    pt_BR: >-
      Generates a one-time, personal link for entering your own Jira or
      Confluence credentials.
    ja_JP: >-
      Generates a one-time, personal link for entering your own Jira or
      Confluence credentials.
  llm: >-
    Give the user a link to enter their own Jira or Confluence credentials.
    Never ask the user to type their password/token in chat -- always use
    this tool and tell them to open the link themselves.
parameters:
  - name: toolset
    type: select
    required: true
    label:
      en_US: Toolset
      zh_Hans: Toolset
      pt_BR: Toolset
      ja_JP: Toolset
    human_description:
      en_US: "Which credentials to set."
      zh_Hans: "Which credentials to set."
      pt_BR: "Which credentials to set."
      ja_JP: "Which credentials to set."
    llm_description: "Which toolset the user wants to set their own credentials for."
    options:
      - value: jira
        label:
          en_US: Jira
          zh_Hans: Jira
          pt_BR: Jira
          ja_JP: Jira
      - value: confluence
        label:
          en_US: Confluence
          zh_Hans: Confluence
          pt_BR: Confluence
          ja_JP: Confluence
    form: llm
extra:
  python:
    source: tools/get_credentials_link.py
