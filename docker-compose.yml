# agentflow -- Open WebUI + agent-skills MCP + Qwen (vLLM)
#
# Every service is a pinned image; every config a mounted file or a
# bootstrapped API call (see scripts/bootstrap.sh); every byte of durable
# state a named volume (see docs/OPERATIONS.md). Nothing is baked into an
# image build, so this maps 1:1 onto Deployments/PVCs later.
#
# mcp-agent-skills deliberately has no published port and is on the backend
# network only -- fastmcp's HTTP transport has no authentication of any
# kind. Reachability from `open-webui` over the internal network is the
# only access control it has; do not add a `ports:` entry to it.

networks:
  frontend:
  backend:

volumes:
  postgres_data:
  open_webui_data:

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_IMAGE_TAG:?set OPEN_WEBUI_IMAGE_TAG in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-agent-skills:
        condition: service_healthy
    env_file: .env
    environment:
      # Open WebUI's own start.sh reads PORT directly for the port uvicorn
      # binds to INSIDE the container -- .env's PORT is the HOST-side
      # published port instead (used only in the `ports:` mapping below),
      # and env_file: .env above would otherwise leak that same value in
      # here too. Pin the container's internal port to 8080 explicitly so
      # the two meanings of PORT never collide; the healthcheck and the
      # `ports:` mapping both assume 8080 on this side.
      PORT: "8080"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      # Open WebUI's own first-party headless-bootstrap mechanism: on
      # startup, if no user exists yet, it creates this admin account
      # itself (then flips signup off) -- scripts/bootstrap.sh only needs
      # to sign in afterwards, not create the account over the API.
      # Safe to leave set permanently; it no-ops once any user exists.
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?set WEBUI_ADMIN_EMAIL in .env}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?set WEBUI_ADMIN_PASSWORD in .env}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentflow}
      # RAG (per-conversation file uploads) reuses the same Postgres
      # instance as a pgvector store, instead of a second database
      # service -- one fewer moving part than LibreChat's dedicated
      # vectordb+rag_api pair, same underlying pgvector engine.
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentflow}
      # OpenAI-compatible connection to this deployment's own vLLM
      # endpoint -- see docs/CONFIGURATION.md for the advertised-model-id
      # caveat (some vLLM setups advertise an `id` that doesn't match the
      # model actually being served).
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: ${VLLM_BASE_URL:?set VLLM_BASE_URL in .env}
      OPENAI_API_KEYS: ${VLLM_API_KEY}
      ENABLE_OLLAMA_API: "false"
      # Native web search, backed by the same internal-only SearXNG
      # instance LibreChat used -- see searxng/ below.
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search
      # Tool Permissions: lets a user switch their own chats to "Ask for
      # approval" for every tool call. This is deliberately NOT the
      # authoritative gate on agent-skills' write actions -- it's a
      # per-user chat preference a user can switch back off, unlike
      # config/tools/agent_skills.py's own confirmation card (shown on
      # every jira_*/confluence_* write regardless of this setting) and
      # agent-skills' own --confirm requirement (enforced in that repo's
      # code, independent of any caller). See docs/CONFIGURATION.md
      # "Tool approval" for why this stays a defense-in-depth default,
      # not the whole story.
      ENABLE_TOOL_PERMISSIONS: "true"
    volumes:
      - open_webui_data:/app/backend/data
    networks: [frontend, backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      # Same check the upstream image's own Dockerfile HEALTHCHECK uses
      # (curl + jq are both present in it) -- /health returns a JSON body,
      # not just a bare 200, so this confirms status:true rather than only
      # that something answered on the port.
      test: ["CMD-SHELL", "curl --silent --fail http://127.0.0.1:8080/health | jq -ne 'input.status == true'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g

  postgres:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentflow}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-agentflow}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 1g

  mcp-agent-skills:
    build:
      context: ./agent-skills
      dockerfile: mcp-server/Dockerfile
      args:
        TOOLSETS: ${MCP_TOOLSETS:-jira}
    restart: unless-stopped
    env_file: .env
    environment:
      # Honors X-Agent-Skills-Env-<VAR> per-request headers (a different
      # Jira/Confluence credential per Open WebUI user, injected by
      # config/tools/agent_skills.py from that tool's own per-user
      # Valves) instead of only this server process's own env. Safe to
      # enable *here* specifically because this service has no published
      # port and no Keycloak provider configured -- `open-webui` on the
      # backend network is the only caller that can reach it at all,
      # which is the network-isolation exception server.py's own startup
      # warning calls out. See agent-skills/AUTHENTICATION.md, Part 3.
      MCP_TRUST_REQUEST_CREDENTIALS: "1"
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8321), timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 512m

  searxng:
    image: searxng/searxng:2026.9.8-3fdc6d753
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 512m
